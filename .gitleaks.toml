# gitleaks configuration.
# Format: https://github.com/gitleaks/gitleaks#configuration
# Start from the upstream default rules and add our own on top.
title = "agentic-sdlc-template"

[extend]
useDefault = true

# A learning turned into a rule.
#
# The pattern: a retro finds the same review comment twice ("a kubeconfig with
# embedded credentials was pasted into a runbook draft"). The default rules do
# not flag the base64 client key, because it is not a known token format. The
# retro promotes the signal to the top of the ladder: a CI rule, so the mistake
# can never pass review again. The story is illustrative; the rule is real.
# See the promotion ladder in docs/inboxes.md.
[[rules]]
id = "kubeconfig-embedded-credentials"
description = "Kubeconfig with an embedded client key or client certificate"
regex = '''(?i)(client-key-data|client-certificate-data)\s*:\s*["']?[A-Za-z0-9+/=]{20,}'''
keywords = ["client-key-data", "client-certificate-data"]
tags = ["kubernetes", "learning"]
